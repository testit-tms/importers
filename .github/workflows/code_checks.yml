name: Code checks

on:
  - pull_request

jobs:
  install:
    name: Check (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9']
        package: [
            testit-importer-allure
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and verify ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import testit_importer_allure"
          testit --help

  flake8:
    name: Check flake8 / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [
            testit-importer-allure
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Install Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install ${{ matrix.package }} and flake8
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8

      - name: Run flake8
        working-directory: ${{ matrix.package }}
        run: flake8 .

  tests:
    name: Unit tests / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [
            testit-importer-allure
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Install Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: python -m unittest discover -s tests -v
